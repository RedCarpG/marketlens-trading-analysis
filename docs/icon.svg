<!-- MarketLens 图标：深色圆角底上一枚放大镜，镜片里是三根逐级抬高的K线（涨/跌/涨），镜框与手柄为青→品红渐变。
     页面里用的是同一份图形：index.html 的 favicon（data URI）和顶栏左上角的标志（内联 SVG）。改图标时三处一起改 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="mlg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00e5ff" />
      <stop offset="1" stop-color="#ff3d9a" />
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="#10132a" />
  <circle cx="28" cy="28" r="16.5" fill="#00e5ff" fill-opacity=".1" stroke="url(#mlg)" stroke-width="4.5" />
  <path d="M40.8 40.8 52.5 52.5" stroke="url(#mlg)" stroke-width="7" stroke-linecap="round" />
  <path d="M20 23v14M28 19.5v13M36 15.5v13" stroke="#cfd6ff" stroke-opacity=".55" stroke-width="1.6" stroke-linecap="round" />
  <rect x="17.8" y="27" width="4.4" height="8" rx="1" fill="#2ee6a8" />
  <rect x="25.8" y="22.5" width="4.4" height="7" rx="1" fill="#ff4d8d" />
  <rect x="33.8" y="18" width="4.4" height="8" rx="1" fill="#2ee6a8" />
</svg>
